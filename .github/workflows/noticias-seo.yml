# Genera una página HTML real por cada noticia (para que Google las indexe) y
# actualiza sitemap.xml. Ver scripts/generar-noticias.mjs para el detalle.
#
# Cuándo corre:
#   - cada hora (las noticias nuevas o editadas aparecen en Google-friendly HTML en <1 h)
#   - a mano: GitHub > pestaña Actions > "Noticias para Google" > Run workflow
#     (útil justo después de publicar una noticia, así no esperás a la próxima hora)
#   - cuando cambia el script o la plantilla Noticias/noticias.html
name: Noticias para Google

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "scripts/generar-noticias.mjs"
      - "Noticias/noticias.html"
      - ".github/workflows/noticias-seo.yml"

permissions:
  contents: write

concurrency:
  group: noticias-seo
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar páginas de noticias y sitemap
        run: node scripts/generar-noticias.mjs

      - name: Guardar cambios (si los hay)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Noticias sitemap.xml
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "chore: actualizar páginas de noticias y sitemap [automático]"
            git push
          fi
